name: Verificación de El Lirio
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: sh mvnw -B verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: el-lirio-frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: el-lirio-frontend/package-lock.json}
      - run: npm ci --no-fund
      - run: npm run build
      - run: npm audit --audit-level=high
  chatbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r chatbot/requirements.txt
      - run: python -m unittest discover -s chatbot/tests -v
