spring.application.name=Gestion Inventario Lirio
spring.profiles.default=demo
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lirio?serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:lirio}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jackson.time-zone=America/Lima
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
jwt.secret=${JWT_SECRET}
jwt.expiration=7200000
lirio.frontend-url=${FRONTEND_URL:http://localhost:5173}
lirio.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
lirio.receipts-directory=${RECEIPTS_DIRECTORY:.data/comprobantes}
lirio.bootstrap-email=${ADMIN_EMAIL:}
lirio.bootstrap-password=${ADMIN_PASSWORD:}
